name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [assistants, datasources, workflows]
    defaults:
      run:
        working-directory: mcp/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      # The packages have no committed lock file; dependencies are always resolved fresh against PyPI.
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Build package
        run: poetry build

      # The server must stop with a clear message when the platform settings are missing.
      - name: Smoke test without settings
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          code=0
          out=$(env -u CODEMIE_AUTH_SERVER_URL -u CODEMIE_AUTH_REALM_NAME -u CODEMIE_API_DOMAIN poetry run "codemie-mcp-$PACKAGE" </dev/null 2>&1) || code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "The server must exit with a non-zero code when settings are missing"; exit 1
          fi
          echo "$out" | grep -qF "Missing required settings: CODEMIE_AUTH_SERVER_URL, CODEMIE_AUTH_REALM_NAME, CODEMIE_API_DOMAIN"

  internal-refs:
    name: Internal references
    permissions:
      contents: read
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-internal-refs-scan.yml@main

  secrets-detection:
    name: Security
    permissions:
      contents: read
      pull-requests: read
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-secrets-detection.yml@main
