name: Publish MCP servers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check or publish, for example mcp-assistants-v0.2.1'
        type: string
        required: true
      dry_run:
        description: 'Build and check only; do not publish'
        type: boolean
        default: true
      publish:
        description: 'Type "publish" to confirm a real release (also requires dry_run off)'
        type: string
        default: ''

permissions:
  contents: read

# One run per tag. A fixed group would keep only the newest pending run and cancel the ones in between.
concurrency:
  group: publish-mcp-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Maps the tag prefix to one package. An unknown prefix fails here and nothing else runs.
  resolve:
    name: Resolve package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.map.outputs.package }}
      prefix: ${{ steps.map.outputs.prefix }}
    steps:
      - name: Map the tag prefix to a package
        id: map
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            mcp-assistants-v*) PACKAGE=assistants ;;
            mcp-datasources-v*) PACKAGE=datasources ;;
            mcp-workflows-v*) PACKAGE=workflows ;;
            *)
              echo "Unknown tag prefix in '$RELEASE_TAG'. Use mcp-assistants-v, mcp-datasources-v or mcp-workflows-v."
              exit 1
              ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "prefix=mcp-$PACKAGE-v" >> "$GITHUB_OUTPUT"

  check-version:
    name: Check version
    needs: resolve
    uses: codemie-ai/ci-workflows/.github/workflows/reusable-release-version-check.yml@main
    with:
      ecosystem: pypi
      package-name: codemie-mcp-${{ needs.resolve.outputs.package }}
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      tag-prefix: ${{ needs.resolve.outputs.prefix }}
      manifest-path: mcp/${{ needs.resolve.outputs.package }}/pyproject.toml

  verify:
    name: Verify and build
    needs: [resolve, check-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/${{ needs.resolve.outputs.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Require main for a real publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.publish == 'publish'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A real publish must run from main, not $GITHUB_REF"; exit 1
          fi

      - name: Stamp the version
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: poetry version "$VERSION"

      # The package has no committed lock file; dependencies are always resolved fresh.
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Build package
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-dist
          path: mcp/${{ needs.resolve.outputs.package }}/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [resolve, check-version, verify]
    if: >-
      github.event_name == 'release' || (github.event_name == 'workflow_dispatch'
      && inputs.dry_run == false && inputs.publish == 'publish'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-dist
          path: dist/

      # TEMPORARY: token for tests. Return to trusted publishing (drop `password`).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
